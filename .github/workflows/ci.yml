name: Calculator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install verification tool
        run: python -m pip install -r requirements-dev.txt
      - name: Run calculator tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Require full calculator coverage
        run: python -m coverage report --fail-under=100
      - name: Check preserved tests-only agent implementation
        working-directory: experiments/q7
        run: python -m unittest discover -s tests -v
